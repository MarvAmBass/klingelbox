name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# or manually via workflow_dispatch against a tag that already exists (useful to
# re-cut assets after a CI hiccup without moving the tag).
#
# Produces and attaches to the GitHub Release (ESP-IDF v5.3.1, target esp32s3,
# THE unified layout — partitions.csv, sized for 4 MB flash so ONE image boots
# on every supported board, 16 MB dev board and 4 MB ESP32-S3 Zero alike):
#
#   klingelbox-esp32s3-full.bin — MERGED image, flashed at offset 0x0. This is what
#       the browser flasher (docs/flasher/) and a bench `esptool.py write_flash 0x0`
#       write. Contains bootloader + partition table + otadata + app + web-UI SPIFFS.
#       The name is a contract: flasher-sync mirrors exactly this asset name and the
#       flasher manifest points at it — do not rename it.
#   klingelbox.bin              — the app image ALONE, for POST /api/ota. Must never
#       be flashed at offset 0x0; it is not a bootable flash image.
#   storage.bin                 — the web-UI SPIFFS image, for POST /api/ota/webui.
#   manifest.json               — size + sha256 for each of the above, plus the flash
#       parameters and the reserved NVS window, so consumers (flasher, scripts) can
#       verify a download without guessing.
#
# ---------------------------------------------------------------------------
# Versioning: the tag must MATCH firmware/CMakeLists.txt, it does not override it.
#
# PROJECT_VER is set with a plain `set(PROJECT_VER "x.y.z")` before project(), which
# means a `-DPROJECT_VER=...` on the command line would simply be overwritten by that
# line — deriving the version from the tag is therefore not actually possible without
# editing the file during the build, and a build tree that disagrees with a developer's
# local `idf.py build` is worse than a hard error. So this workflow asserts that the
# tag and PROJECT_VER agree and fails loudly otherwise. PROJECT_VER is what
# esp_app_get_description()->version reports through GET /api/system, so a mismatch
# would mean a device claiming a version that no release ever shipped.
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release + upload assets

env:
  IDF_VERSION: v5.3.1

jobs:
  firmware:
    name: Build ESP32-S3 release images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # On workflow_dispatch github.ref is the branch the workflow was launched from,
      # so check out the requested tag explicitly. On a tag push both are the tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag and verify it matches PROJECT_VER
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *)  echo "::error::tag '$TAG' does not start with 'v'"; exit 1 ;;
          esac
          # Single source of truth: set(PROJECT_VER "x.y.z") in firmware/CMakeLists.txt.
          PROJECT_VER="$(sed -n 's/^[[:space:]]*set(PROJECT_VER[[:space:]]*"\([^"]*\)".*/\1/p' \
                          firmware/CMakeLists.txt | head -n1)"
          if [ -z "$PROJECT_VER" ]; then
            echo "::error::could not read PROJECT_VER from firmware/CMakeLists.txt"; exit 1
          fi
          if [ "$PROJECT_VER" != "$VERSION" ]; then
            echo "::error::tag $TAG implies version $VERSION but firmware/CMakeLists.txt" \
                 "sets PROJECT_VER=$PROJECT_VER. Bump PROJECT_VER and re-tag —" \
                 "the device reports PROJECT_VER via GET /api/system."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (PROJECT_VER=$PROJECT_VER)"

      # Same cache as ci.yml: only the managed component downloads are worth caching,
      # the toolchain itself comes from the prebuilt espressif/idf docker image.
      - name: Cache managed components
        uses: actions/cache@v4
        with:
          path: firmware/managed_components
          key: idf-${{ env.IDF_VERSION }}-components-${{ hashFiles('firmware/main/idf_component.yml') }}
          restore-keys: |
            idf-${{ env.IDF_VERSION }}-components-

      # ONE image for every supported board: partitions.csv is sized for 4 MB
      # flash, and a 16 MB chip simply leaves its upper 12 MB unused. There is no
      # per-board variant anymore — that was the point (one image, one flasher
      # click, no self-builds), and the headroom gate below is what that decision
      # traded the 2 MB app slots for.
      - name: Build firmware (ESP-IDF ${{ env.IDF_VERSION }}, esp32s3, unified layout)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: firmware

      # -----------------------------------------------------------------------
      # THE HEADROOM GATE — the safety net the one-image decision traded slot
      # size for. The unified layout's 0x170000 app slots replaced the old 16 MB
      # table's 0x200000 ones, so the app sits much closer to its ceiling now.
      # ESP-IDF only fails at 100%; shipping a release that close would mean the
      # NEXT feature cannot ship at all. Failing loudly at 90% keeps a whole
      # release cycle of margin. The slot size is parsed from partitions.csv, not
      # hard-coded, so a layout edit cannot silently invalidate the gate.
      # -----------------------------------------------------------------------
      - name: Headroom gate — refuse to release an app past 90% of its slot
        working-directory: firmware
        run: |
          python3 - <<'PY'
          import os, sys

          slot = None
          with open("partitions.csv") as fh:
              for line in fh:
                  cols = [c.strip() for c in line.split("#", 1)[0].split(",")]
                  if len(cols) >= 5 and cols[0] == "ota_0":
                      slot = int(cols[4], 0)
          if not slot:
              sys.exit("could not parse the ota_0 slot size from partitions.csv")

          app = os.path.getsize("build/klingelbox.bin")
          pct = 100.0 * app / slot
          print(f"app image: {app:#x} ({app}) of {slot:#x} ({slot}) per slot "
                f"— {pct:.1f}% used, {slot - app} bytes free")
          if pct > 90.0:
              sys.exit(
                  f"::error::the app fills {pct:.1f}% of a {slot:#x} OTA slot — "
                  "past the 90% release gate. This slot size is the accepted cost "
                  "of shipping ONE image for every board (see partitions.csv); the "
                  "gate exists so a release never lands close enough to the "
                  "ceiling that the next fix cannot ship. Do NOT raise the "
                  "threshold. Shrink the image instead: check build/klingelbox.map "
                  "for what grew, drop unused IDF features in sdkconfig.defaults, "
                  "or move rarely-used functionality out. If the firmware has "
                  "genuinely outgrown 4 MB flash, that is a decision to unmake "
                  "deliberately — per-board images again — not to squeeze past.")
          print("headroom gate passed")
          PY

      # esptool ships inside the ESP-IDF container, but this step runs on the runner
      # itself, so install it via pip.
      #
      # The <5 pin is load-bearing: esptool 5 dropped the `esptool.py` entry point and
      # renamed `merge_bin` to `merge-bin` with dashed flags. Pinning to the 4.x line
      # keeps this step matching the syntax ESP-IDF 5.3.1 itself uses.
      - name: Install esptool
        run: python3 -m pip install --upgrade "esptool>=4.7,<5"

      # -----------------------------------------------------------------------
      # The merged image.
      #
      # The explicit offset list below IS the contract the browser flasher relies on,
      # so it is cross-checked against the offsets ESP-IDF actually recorded for this
      # build and fails loudly on any drift (new partition, moved offset, unexpected
      # segment).
      #
      # --flash_size/--flash_mode/--flash_freq make merge_bin stamp the bootloader
      # header here, on the build host (4 MB / DIO / 80 MHz), so the flasher can write
      # with "keep" and never re-stamp it. The 4 MB stamp is correct for the 16 MB
      # dev board too: the runtime clamps itself to the header size and leaves the
      # upper 12 MB unused (esp_flash logs one "Detected size larger..." warning at
      # boot — expected, benign). Already-deployed boxes never see this stamp at
      # all: OTA replaces only the app, so their 16 MB bootloader header and 16 MB
      # partition table stay in place and keep working.
      #
      # CRITICAL: the merge must NEVER include an nvs segment. Nothing is listed at
      # 0x9000, so merge_bin leaves 0x9000..0x1d000 (the whole NVS partition —
      # partitions.csv grew it from 0x6000 to 0x14000) as 0xFF padding. That window
      # is reserved for the browser flasher to inject a generated NVS config seed
      # (Wi-Fi credentials etc.) before writing; merging an nvs image here would
      # overwrite that seed with an empty partition and silently break first-boot
      # provisioning. The step after this one verifies the window really is 0xFF in
      # the produced file. If the NVS partition moves or resizes again, update the
      # offsets HERE, in the verify step, in the manifest's nvs_gap, and in ci.yml —
      # they all describe the same partitions.csv fact.
      # -----------------------------------------------------------------------
      - name: Merge flashable image and collect OTA images
        working-directory: firmware
        run: |
          BUILD=build
          mkdir -p ../dist
          python3 - "$BUILD" <<'PY'
          import json, os, sys
          build = sys.argv[1]
          args = json.load(open(os.path.join(build, "flasher_args.json")))
          recorded = {int(off, 16): os.path.normpath(f)
                      for off, f in args["flash_files"].items()}
          expected = {
              0x0:      "bootloader/bootloader.bin",
              0x8000:   "partition_table/partition-table.bin",
              0x1d000:  "ota_data_initial.bin",
              0x20000:  "klingelbox.bin",
              0x300000: "storage.bin",
          }
          if recorded != expected:
              sys.exit("flasher_args.json disagrees with the explicit merge list:\n"
                       f"  recorded: { {hex(k): v for k, v in sorted(recorded.items())} }\n"
                       f"  expected: { {hex(k): v for k, v in sorted(expected.items())} }")
          assert 0x9000 not in recorded, "nvs segment must never be merged (flasher gap)"
          print("flasher_args.json offsets match the explicit merge list")
          PY
          esptool.py --chip esp32s3 merge_bin -o ../dist/klingelbox-esp32s3-full.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0      "$BUILD/bootloader/bootloader.bin" \
            0x8000   "$BUILD/partition_table/partition-table.bin" \
            0x1d000  "$BUILD/ota_data_initial.bin" \
            0x20000  "$BUILD/klingelbox.bin" \
            0x300000 "$BUILD/storage.bin"
          # App-only image for POST /api/ota, and the web-UI image for
          # POST /api/ota/webui. Stable names — the on-device updater and the docs
          # link to releases/latest/download/<name>.
          cp "$BUILD/klingelbox.bin" ../dist/klingelbox.bin
          cp "$BUILD/storage.bin"    ../dist/storage.bin
          ls -l ../dist

      # Direct assertion of the property the flasher depends on, rather than trusting
      # that "we did not list nvs" implies "the bytes are 0xFF".
      - name: Verify the NVS window is untouched 0xFF padding
        run: |
          python3 - <<'PY'
          import sys
          # The FULL nvs partition from partitions.csv (0x9000, size 0x14000) —
          # deliberately unchanged by the unified 4 MB layout: the 80 KB NVS is
          # the user's configuration space and every layout revision keeps it —
          # not merely the gap up to the next merged segment. Checking the whole
          # window is what catches a partition-table edit that quietly slides
          # otadata into what the flasher believes is reserved NVS space.
          START, END = 0x9000, 0x1d000
          with open("dist/klingelbox-esp32s3-full.bin", "rb") as fh:
              fh.seek(START)
              gap = fh.read(END - START)
          if len(gap) != END - START:
              sys.exit(f"merged image is too short: only {len(gap)} bytes at {START:#x}")
          if gap.strip(b"\xff"):
              bad = next(i for i, b in enumerate(gap) if b != 0xFF)
              sys.exit(f"merged image has non-0xFF data at {START + bad:#x} — an nvs "
                       "segment leaked into the merge; the browser flasher's config "
                       "seed would be overwritten")
          print(f"{START:#x}..{END:#x} is 0xFF padding — flasher NVS gap intact")
          PY

      # Sizes + sha256 so a download can be verified without a second round trip.
      - name: Generate manifest.json
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone

          images = [
              ("klingelbox-esp32s3-full.bin", "0x0",
               "Merged full image: bootloader + partition table + otadata + app + "
               "web-UI SPIFFS. Flash at offset 0x0."),
              ("klingelbox.bin", None,
               "App image only, for POST /api/ota. Never flash at offset 0x0."),
              ("storage.bin", None,
               "Web-UI SPIFFS image, for POST /api/ota/webui."),
          ]
          assets = []
          for name, offset, purpose in images:
              path = os.path.join("dist", name)
              with open(path, "rb") as fh:
                  digest = hashlib.sha256(fh.read()).hexdigest()
              entry = {"name": name, "size": os.path.getsize(path), "sha256": digest,
                       "purpose": purpose}
              if offset:
                  entry["offset"] = offset
              assets.append(entry)

          manifest = {
              "generated": datetime.now(timezone.utc)
                           .isoformat(timespec="seconds").replace("+00:00", "Z"),
              "version": os.environ["VERSION"],
              "tag": os.environ["TAG"],
              "target": "esp32s3",
              "idf_version": os.environ.get("IDF_VERSION", "v5.3.1"),
              # 4MB is what the merged image is stamped with (the unified layout);
              # boards with more flash clamp to it at boot and leave the rest unused.
              "flash": {"size": "4MB", "mode": "dio", "freq": "80m"},
              # Deliberately left as 0xFF in the merged image so the browser flasher
              # can inject a generated NVS config seed there before writing. Matches
              # the nvs partition in partitions.csv (grown from 0x6000 in v0.6.x).
              "nvs_gap": {"offset": "0x9000", "size": "0x14000"},
              "assets": assets,
          }
          with open("dist/manifest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      # Checked out purely for the tag object: the notes step below reads the
      # annotation with git, and without a working tree that step died with
      # "fatal: not a git repository". It runs BEFORE the artifact download
      # because actions/checkout cleans the workspace, which would otherwise
      # delete the very files being uploaded.
      - name: Check out the tag, for its annotation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.firmware.outputs.tag }}
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32s3
          path: release

      - name: List release assets
        run: ls -l release

      # The annotated tag's own message is the release notes.
      #
      # Without this the body was ONLY GitHub's generated changelog -- a single
      # "Full Changelog" link -- and every carefully written tag annotation was
      # invisible on the releases page. The person deciding whether to flash a
      # new build reads that page, so it should say what changed and why, not
      # just diff two refs.
      #
      # generate_release_notes stays on: softprops appends the generated
      # changelog beneath the body, so the prose and the commit list both appear.
      - name: Take the release notes from the tag message
        id: notes
        run: |
          set -euo pipefail
          TAG='${{ needs.firmware.outputs.tag }}'
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" --no-tags 2>/dev/null || true
          # %(contents:body) is the annotation minus its subject line; the subject
          # is already the release title, so repeating it reads badly.
          SUBJECT=$(git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)')
          BODY=$(git for-each-ref "refs/tags/$TAG" --format='%(contents:body)')
          {
            echo 'body<<KLINGELBOX_EOF'
            # An `&&` chain here would return non-zero on an empty subject and,
            # under `bash -e`, take the whole step down with it.
            if [ -n "$SUBJECT" ]; then
              echo "$SUBJECT"
              echo
            fi
            echo "$BODY"
            echo 'KLINGELBOX_EOF'
          } >> "$GITHUB_OUTPUT"

      # tag_name is passed explicitly so the manual workflow_dispatch path targets
      # the right tag instead of the launching branch.
      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.firmware.outputs.tag }}
          files: release/*
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
          fail_on_unmatched_files: true
