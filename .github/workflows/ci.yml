name: CI

# Continuous integration for Klingelbox (ESP-IDF v5.3.1, target esp32s3).
#
#   * host-tests — the plain-gcc logic tests in firmware/host-test/. NO ESP-IDF is
#                  involved by design: rf_frame.c / rf_decode.c / rf_ev1527.c must stay
#                  free of IDF and FreeRTOS headers, and this job failing to compile is
#                  itself the layering test (see firmware/host-test/Makefile). It runs
#                  first because it takes seconds while the firmware build takes minutes.
#   * flasher-checks — a plain `node --check` over the browser flasher sources. The
#                  flasher is served straight from docs/ with no build step, so a
#                  syntax error would otherwise reach the published page unnoticed.
#   * firmware   — builds the real firmware ONCE. There is exactly ONE layout
#                  (partitions.csv, sized for 4 MB flash) and ONE image, and it boots on
#                  every supported board — the 16 MB N16R8 dev board and the 4 MB
#                  ESP32-S3 Zero alike; a 16 MB chip just leaves its upper 12 MB unused.
#                  The 0x170000 app slots are easy to outgrow silently, so ESP-IDF hard-
#                  erroring when the app no longer fits is backed by an explicit fit
#                  report that prints the remaining headroom on every push — a slow creep
#                  toward the limit stays visible long before it becomes a build failure
#                  (release.yml additionally HARD-FAILS a release past 90% of a slot).
#
# The firmware build also fails on compiler warnings in FIRST-PARTY code (see the
# "Fail on compiler warnings" step for why this is a log scan rather than a blanket
# -Werror).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IDF_VERSION: v5.3.1

jobs:
  host-tests:
    name: Host logic tests (gcc, no IDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # `make test` builds test_rf_decode from the rfpulse sources and runs it.
      # The binary asserts on every vector and prints its check count (1176 at the
      # time of writing); a non-zero exit fails the job.
      - name: Build and run host tests
        working-directory: firmware/host-test
        run: make test

  # Lightweight checks for the browser flasher (docs/flasher/). Guarded on the
  # directory existing so CI stays green until the flasher tree lands, then enforces
  # automatically. Only the top-level sources are checked — docs/flasher/lib/ holds a
  # vendored third-party bundle (esptool-js) that is not ours to fix.
  flasher-checks:
    name: Flasher JS checks (docs/flasher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect docs/flasher
        id: detect
        run: |
          if [ -d docs/flasher ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::docs/flasher not present yet — skipping flasher checks."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check the flasher sources
        if: steps.detect.outputs.present == 'true'
        run: |
          shopt -s nullglob
          files=(docs/flasher/*.js docs/flasher/*.mjs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::docs/flasher exists but contains no .js/.mjs sources"; exit 1
          fi
          for f in "${files[@]}"; do
            echo "node --check $f"
            # index.html loads flasher.js with type="module"; node --check treats a
            # bare .js as CommonJS, so retry as an ES module before calling it a
            # failure (import/export at top level is legal in the browser here).
            node --check "$f" \
              || node --input-type=module --check < "$f" \
              || { echo "::error file=$f::syntax error"; exit 1; }
          done

  firmware:
    name: Firmware (unified image)
    runs-on: ubuntu-latest
    needs: host-tests
    # One layout, one build. The former 16mb/4mb matrix is gone on purpose: the
    # release ships a single image sized for 4 MB flash (partitions.csv) that
    # every supported board takes, so a second variant build would verify a
    # configuration nothing ships anymore.
    env:
      BUILD_DIR: build-ci
      BUILD_LOG: build-ci.log
    steps:
      - uses: actions/checkout@v4

      # The ESP-IDF toolchain itself arrives as a prebuilt docker image
      # (espressif/idf:<version>), so there is nothing to cache for it. What IS
      # worth caching is the IDF component manager's download of the managed
      # dependencies (main/idf_component.yml -> espressif__mdns), which otherwise
      # hits the component registry on every single build.
      - name: Cache managed components
        uses: actions/cache@v4
        with:
          path: firmware/managed_components
          key: idf-${{ env.IDF_VERSION }}-components-${{ hashFiles('firmware/main/idf_component.yml') }}
          restore-keys: |
            idf-${{ env.IDF_VERSION }}-components-

      # sdkconfig is gitignored, so CI always regenerates it from
      # sdkconfig.defaults — a fresh checkout and a developer build agree.
      #
      # `bash -c "set -o pipefail && ... | tee"` is deliberate: without pipefail the
      # pipeline would report tee's exit status and a failing build would go green.
      - name: Build firmware (ESP-IDF ${{ env.IDF_VERSION }}, esp32s3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: firmware
          command: >-
            bash -c "set -o pipefail && idf.py -B '${{ env.BUILD_DIR }}'
            build 2>&1 | tee '${{ env.BUILD_LOG }}'"

      # Warnings-as-errors, scoped to OUR code.
      #
      # Why not simply -DEXTRA_CFLAGS=-Werror: in ESP-IDF that flag is applied to
      # every component, including the several hundred that ship with IDF itself.
      # A future IDF point release emitting one new warning in its own sources would
      # then break this repo's CI for a reason nobody here can fix. Scanning the build
      # log and failing only on warnings whose file path is under firmware/main/,
      # components/cc1101/ or components/rfpulse/ gives the same discipline over the
      # code we own without that hostage situation. managed_components/ is excluded
      # for the same reason (third-party, e.g. espressif__mdns).
      - name: Fail on compiler warnings (first-party sources)
        working-directory: firmware
        run: |
          LOG="${{ env.BUILD_LOG }}"
          if [ ! -f "$LOG" ]; then
            echo "::error::build log $LOG missing — did the build step change?"; exit 1
          fi
          # idf.py colourises output; strip ANSI escapes before matching.
          sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > /tmp/build-clean.log
          grep -E 'warning:' /tmp/build-clean.log \
            | grep -Ev 'managed_components' \
            | grep -E '(^|/)(main|components/(cc1101|rfpulse))/[^ ]*:[0-9]+:' \
            > /tmp/first-party-warnings.txt || true
          if [ -s /tmp/first-party-warnings.txt ]; then
            echo "::error::compiler warnings in first-party sources:"
            cat /tmp/first-party-warnings.txt
            while IFS= read -r line; do echo "::warning::$line"; done < /tmp/first-party-warnings.txt
            exit 1
          fi
          echo "No first-party compiler warnings."

      # ESP-IDF already hard-errors if the app outgrows its OTA slot, so this step is
      # about VISIBILITY: it prints how much room is left. The unified layout has
      # 0x170000 app slots and a 1 MB web-UI partition on EVERY board — this is the
      # size the one-image decision traded for, so crossing 90% is the moment to
      # start caring, long before the build breaks. (This step only warns; the
      # matching gate in release.yml FAILS a release past 90%.)
      #
      # Two different kinds of measurement, deliberately:
      #   * the app image is as large as the code, so its size vs. the slot IS the
      #     headroom;
      #   * storage.bin is a SPIFFS image and is ALWAYS exactly the partition size
      #     (mkspiffs formats the whole partition), so comparing it to the partition
      #     would report 100% forever. Its real headroom is the size of the web UI
      #     *content* going into it, so that is what is measured — with the same
      #     source-directory choice main/CMakeLists.txt makes.
      - name: Report partition headroom
        working-directory: firmware
        env:
          CSV: partitions.csv
        run: |
          python3 - <<'PY'
          import os, sys

          build = os.environ["BUILD_DIR"]
          csv = os.environ["CSV"]
          failed = False

          # Minimal partition-table parse: Name,Type,SubType,Offset,Size,Flags
          sizes = {}
          with open(csv) as fh:
              for line in fh:
                  line = line.split("#", 1)[0].strip()
                  if not line:
                      continue
                  cols = [c.strip() for c in line.split(",")]
                  if len(cols) >= 5 and cols[4]:
                      sizes[cols[0]] = int(cols[4], 0)

          def report(label, used, cap, tight_hint=True):
              global failed
              pct = 100.0 * used / cap
              print(f"{label:<20} {used:>8} / {cap:>8} bytes  ({pct:5.1f}% used, "
                    f"{cap - used} free)")
              if used > cap:
                  print(f"::error::{label} does not fit the {csv} layout")
                  failed = True
              elif pct > 90.0 and tight_hint:
                  print(f"::warning::{label} is at {pct:.1f}% of its partition in "
                        f"{csv} — the unified 4 MB layout has no bigger variant to "
                        f"fall back to, and release.yml will refuse to ship this")

          app = os.path.join(build, "klingelbox.bin")
          if os.path.isfile(app):
              report("app (ota_0)", os.path.getsize(app), sizes["ota_0"])
          else:
              print(f"::error::{app} was not produced by the build")
              failed = True

          storage = os.path.join(build, "storage.bin")
          if os.path.isfile(storage):
              # Sanity check that the build really used the partition table we parsed.
              actual, expected = os.path.getsize(storage), sizes["storage"]
              if actual != expected:
                  print(f"::error::storage.bin is {actual} bytes but {csv} declares "
                        f"{expected} — the build used a different partition table")
                  failed = True
              else:
                  print(f"storage.bin matches the {csv} `storage` partition "
                        f"({expected} bytes, SPIFFS images always fill it)")
          else:
              print(f"::error::{storage} was not produced by the build")
              failed = True

          # Measure what is actually IMAGED, which since the gzip step is the
          # compressed staging directory -- not webui/. Sizing the raw sources
          # failed this job at 127% while the real image sat at 43%, because the
          # check predates compression and nobody told it.
          gz = os.path.join(os.environ.get("BUILD_DIR", "build"), "webui-gz")
          if os.path.isdir(gz) and os.listdir(gz):
              webui = gz
          else:
              # Same source-directory choice as main/CMakeLists.txt.
              webui = "webui" if os.path.isfile("webui/index.html") else "main/www"
          content = 0
          for root, _dirs, files in os.walk(webui):
              for name in files:
                  content += os.path.getsize(os.path.join(root, name))
          print(f"(web UI content from {webui}/)")
          # ~90% is where SPIFFS metadata overhead starts to bite, so the same
          # threshold is a reasonable alarm here too.
          report("web UI content", content, sizes["storage"])

          sys.exit(1 if failed else 0)
          PY

      # release.yml hard-codes the flash offsets of the unified layout for the
      # merged image the browser flasher writes. Catching drift here — on a PR — is
      # far cheaper than catching it while cutting a release. The nvs assertion is
      # the important one: nvs must never become part of a merged image (see
      # release.yml for the full explanation).
      - name: Cross-check flash offsets against the flasher contract
        working-directory: firmware
        run: |
          python3 - <<'PY'
          import json, os, sys

          build = os.environ["BUILD_DIR"]
          args = json.load(open(os.path.join(build, "flasher_args.json")))
          recorded = {int(off, 16): os.path.normpath(f)
                      for off, f in args["flash_files"].items()}
          expected = {
              0x0:      "bootloader/bootloader.bin",
              0x8000:   "partition_table/partition-table.bin",
              0x1d000:  "ota_data_initial.bin",
              0x20000:  "klingelbox.bin",
              0x300000: "storage.bin",
          }
          if recorded != expected:
              sys.exit("flasher_args.json disagrees with the flasher contract:\n"
                       f"  recorded: { {hex(k): v for k, v in sorted(recorded.items())} }\n"
                       f"  expected: { {hex(k): v for k, v in sorted(expected.items())} }")
          assert 0x9000 not in recorded, "nvs must never be flashed (browser-flasher gap)"
          print("flash offsets match the flasher contract")
          PY

      # Short-retention build output, so a failing PR can be inspected without
      # reproducing the whole IDF build locally.
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-firmware
          path: |
            firmware/${{ env.BUILD_DIR }}/*.bin
            firmware/${{ env.BUILD_DIR }}/*.map
            firmware/${{ env.BUILD_DIR }}/flasher_args.json
            firmware/${{ env.BUILD_LOG }}
          if-no-files-found: warn
          retention-days: 7
