<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a202a" media="(prefers-color-scheme: dark)">
<title>Klingelbox</title>
<link rel="stylesheet" href="/style.css">
</head>
<!--
  Klingelbox web UI — mobile-first shell.
  The product name is German, and so is one of the two interface languages:
  English and German, toggled from the header. English strings are the
  translation keys — see the i18n block in app.js and README.md.

  FIVE destinations, and the first one is the product: the node graph. The
  Dashboard IS the map and nothing else — the live feed has its own tab
  (Activity) and the written manual has its own tab (Handbook), because both
  used to push the graph off the top of a 360 px screen.

  There is still no separate Signals or Learn screen — a signal is heard,
  created, inspected and deleted from inside the node that uses it, so the graph
  is the only place wiring happens.

  The markup here is only the frame: header, the two navigations (a bottom bar
  on phones, a header tab strip from 720 px up) and one empty <section> per
  screen. Everything inside the sections is built by app.js, because every
  screen's content depends on what the box actually reports — a node graph, a
  live event feed, a diagnostics table — and because a feature whose endpoint
  answers 404/503 must vanish rather than sit there as dead HTML.

  Both navigations are always in the DOM and select the same panes; CSS decides
  which one is visible, so there is no JS branch on viewport width for nav.
-->
<body>

<header class="topbar">
  <div class="brand">
    <span id="brand-dot" class="brand-dot" aria-hidden="true"></span>
    <h1>Klingelbox<span id="brand-ver" class="brand-ver"></span></h1>
  </div>

  <!-- Wide-screen tab strip. Hidden below 720 px, where .bottomnav takes over. -->
  <nav class="tabs" role="tablist" aria-label="Sections" data-i18n-aria>
    <button class="tab active" type="button" data-tab="dashboard" role="tab" aria-selected="true" data-i18n>Dashboard</button>
    <button class="tab" type="button" data-tab="activity" role="tab" aria-selected="false" data-i18n>Activity</button>
    <button class="tab" type="button" data-tab="settings" role="tab" aria-selected="false" data-i18n>Settings</button>
    <button class="tab" type="button" data-tab="diagnostics" role="tab" aria-selected="false" data-i18n>Diagnostics</button>
    <button class="tab" type="button" data-tab="handbook" role="tab" aria-selected="false" data-i18n>Handbook</button>
  </nav>


  <!-- Box status: a right-aligned block INSIDE the header row, two lines tall.
       Placed before .topbar-right so it sits to the LEFT of the theme toggle —
       the toggle and the badge stay the rightmost controls.

       app.js builds these chips ONCE and thereafter only assigns nodeValue: the
       uptime ticks at 1 Hz, and a rebuilt row would repaint the header every
       second. -->
  <div id="status-chips" class="statuschips" aria-label="Box status" data-i18n-aria></div>

  <!-- Two toggles, same class, same 44 px square: theme and language are the
       same kind of control — one tap, one stored preference, nothing to undo.
       The language button shows the language you would GET (DE while you are
       reading English), because showing the current one makes the tap a
       guess. -->
  <div class="topbar-right">
    <button id="lang-toggle" class="theme-toggle lang-toggle" type="button" aria-label="Language">DE</button>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Theme" data-i18n-aria>&#128421;</button>
    <div id="status-badge" class="status-badge" title="Box status" data-i18n-title>&hellip;</div>
  </div>

</header>

<main>
  <!-- Recovery first-run wizard. app.js fills and reveals this, and adds
       .recovery to <body>, when /api/system reports wifi_mode == "recovery". -->
  <section id="tab-recovery" class="tabpane" role="tabpanel" aria-label="Wi-Fi setup" data-i18n-aria></section>

  <!-- The Dashboard IS the node graph and only the node graph: the two
       blocking warnings, the status chips, the view switch + ➕ Add node, then
       the map itself. -->
  <section id="tab-dashboard"   class="tabpane active" role="tabpanel" aria-label="Dashboard" data-i18n-aria></section>
  <!-- The live event feed, a whole page of it, with search and a kind filter
       above the list. Polls /api/events only while it is the visible tab. -->
  <section id="tab-activity"    class="tabpane" role="tabpanel" aria-label="Activity" data-i18n-aria></section>
  <section id="tab-settings"    class="tabpane" role="tabpanel" aria-label="Settings" data-i18n-aria></section>
  <section id="tab-diagnostics" class="tabpane" role="tabpanel" aria-label="Diagnostics" data-i18n-aria></section>
  <!-- The offline manual. This box can be reached over its own captive portal
       with no internet at all, so the documentation has to ship inside it. -->
  <section id="tab-handbook"    class="tabpane" role="tabpanel" aria-label="Handbook" data-i18n-aria></section>

  <footer class="foot">Klingelbox &mdash; <i>Die Klingel, lokal und ohne Cloud.</i><span id="foot-ver"></span></footer>
</main>

<!-- Phone navigation: fixed to the bottom, in thumb reach. FIVE targets share
     the full width at 360 px, so each is 72x56 px — still comfortably past the
     44 px floor in both axes, and five is where that stops being true, so this
     bar is full.

     The labels are the short forms on purpose: the header strip at 720 px has
     room for "Diagnostics" and this bar does not, and a label that wraps to two
     lines costs more legibility than the two syllables it saves. "Map" is what
     the Dashboard actually is now. Still an overflow-x scroller as a safety net
     for 280 px devices and very large system text. -->
<nav class="bottomnav" role="tablist" aria-label="Sections" data-i18n-aria>
  <button class="navbtn active" type="button" data-tab="dashboard" role="tab" aria-selected="true">
    <span class="ico" aria-hidden="true">&#128256;</span><span class="lbl" data-i18n>Map</span></button>
  <button class="navbtn" type="button" data-tab="activity" role="tab" aria-selected="false">
    <span class="ico" aria-hidden="true">&#128276;</span><span class="lbl" data-i18n>Activity</span></button>
  <button class="navbtn" type="button" data-tab="settings" role="tab" aria-selected="false">
    <span class="ico" aria-hidden="true">&#9881;</span><span class="lbl" data-i18n>Setup</span></button>
  <button class="navbtn" type="button" data-tab="diagnostics" role="tab" aria-selected="false">
    <span class="ico" aria-hidden="true">&#129514;</span><span class="lbl" data-i18n>Health</span></button>
  <button class="navbtn" type="button" data-tab="handbook" role="tab" aria-selected="false">
    <span class="ico" aria-hidden="true">&#128214;</span><span class="lbl" data-i18n>Handbook</span></button>
</nav>

<!-- The German dictionary is its own file: a translation fix is then a readable
     diff in one place, with no JavaScript around it, and adding a language
     means adding a file rather than editing app.js. English needs no
     dictionary — the English strings ARE the lookup keys (see app.js). -->
<script src="/lang-de.js"></script>
<script src="/app.js"></script>
</body>
</html>
